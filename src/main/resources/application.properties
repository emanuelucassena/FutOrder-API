spring.application.name=fut-order


# 1. CREDENCIAIS DO BANCO DE DADOS

# A URL aponta para a sua máquina (localhost), porta,
spring.datasource.url=jdbc:mysql://localhost:3306/fut_order_db?serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
#COLOQUE A SUA SENHA AQUI:
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. CONFIGURAÇÕES DO HIBERNATE/JPA

# Exibe no console os comandos SQL gerados (excelente para estudos)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# O "validate" instrui o Hibernate a apenas conferir se o schema do banco bate com suas @Entity quem cria/altera tabelas agora é o Flyway
spring.jpa.hibernate.ddl-auto=validate

# 3. CONFIGURAÇÕES DO FLYWAY

# Permite ao Flyway limpar a tentativa com falha e executar o arquivo V1 corrigido
spring.flyway.repair-on-migrate=true